<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ustaw nowe hasło</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container" style="padding-top:140px;max-width:520px;">
    <h2>Ustaw nowe hasło</h2>
    <p class="large-copy">Wprowadź nowe hasło.</p>
    <form id="reset-form" style="margin-top:20px;display:grid;gap:12px;">
      <input type="password" id="password" placeholder="Nowe hasło" required style="padding:12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink)">
      <input type="hidden" id="token">
      <button class="button button-primary" type="submit">Zmień hasło</button>
      <p id="msg" style="color:var(--gold)"></p>
    </form>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
